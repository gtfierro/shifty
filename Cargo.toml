[workspace]
members = [
    "crates/shifty-algebra",
    "crates/shifty-parse",
    "crates/shifty-opt",
    "crates/shifty-engine",
    "crates/shifty-repair",
    "crates/shifty-cli",
    "crates/shifty-wasm",
    "cpp",
    "python",
]
resolver = "2"

[workspace.package]
version = "0.5.0-alpha.3"
authors = ["Gabe Fierro <gtfierro@mines.edu>"]
license = "BSD-3-Clause"
edition = "2024"
description = "Formalism-first SHACL + SHACL-AF engine (inference + validation) in Rust"
readme = "README.md"
repository = "https://github.com/gtfierro/shifty"
homepage = "https://github.com/gtfierro/shifty"
documentation = "https://shifty.gtf.fyi/"

[workspace.dependencies]
# internal crates
shifty-algebra = { path = "crates/shifty-algebra", version = "0.5.0-alpha.3" }
shifty-parse = { path = "crates/shifty-parse", version = "0.5.0-alpha.3" }
shifty-opt = { path = "crates/shifty-opt", version = "0.5.0-alpha.3" }
shifty-engine = { path = "crates/shifty-engine", version = "0.5.0-alpha.3" }
shifty-repair = { path = "crates/shifty-repair", version = "0.5.0-alpha.3" }

# external
#
# The oxigraph family (oxrdf, oxrdfio, oxttl, oxsdatatypes, spargebra, spareval,
# sparesults and oxigraph itself) pins its own members with `=` requirements
# upstream: oxigraph 0.5.11 depends on oxrdf =0.3.4, and every sibling agrees.
# We hand those same types across the boundary, so a floating requirement here
# would either resolve two incompatible copies of oxrdf or hold the whole family
# back to whatever our oldest pin allows. Bump them together, never singly, and
# check https://crates.io/crates/oxigraph for the set that belongs with the
# oxigraph release you are moving to; `cargo update` alone cannot do it.
oxrdf = { version = "=0.3.4", features = ["serde", "oxsdatatypes"] }
oxrdfio = "=0.2.6"
oxsdatatypes = "0.2.3"
bigdecimal = "0.4"
oxttl = "0.2.4"
oxigraph = { version = "0.5.11", default-features = false }
spargebra = { version = "=0.4.7", features = ["sep-0006"] }
spareval = "=0.2.7"
petgraph = "0.8"
clap = { version = "4.5.39", features = ["derive"] }
ureq = { version = "3.4.2" }
regex = "1"
# Non-cryptographic hasher for hot internal maps whose keys are already
# trusted (shape ids, RDF terms from the parsed graph). Nothing here is
# exposed to adversarial input, so SipHash's collision resistance buys
# nothing over the cost of hashing every IRI byte with it.
rustc-hash = "2.1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sparesults = "0.3.4"
# Monotonic clock that maps to std::time on native and performance.now() on
# wasm32 (std::time::Instant panics there). Drop-in API-compatible with std.
web-time = "1.1"

[profile.release]
debug = true

# Slim profile for the wasm bundle: the workspace `release` keeps full debuginfo
# (for perf), which balloons the .wasm to ~100 MB. Build the browser module with
# `--profile wasm-release` to strip it and optimize for size.
[profile.wasm-release]
inherits = "release"
debug = false
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
