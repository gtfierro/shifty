[package]
name = "pyshifty"
version.workspace = true
edition.workspace = true
description = "Python bindings for the shifty SHACL engine"
license = "BSD-3-Clause"
documentation.workspace = true
homepage = "https://github.com/gtfierro/shifty"
repository = "https://github.com/gtfierro/shifty"
# Keep source archives independent of local reports, examples, and scratch data.
include = ["src/**", "shifty/**", "Cargo.toml", "pyproject.toml", "README.md", "LICENSE"]

[lib]
name = "_shifty"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
shifty-algebra.workspace = true
shifty-parse.workspace = true
shifty-opt.workspace = true
shifty-engine.workspace = true
shifty-repair.workspace = true
shapeshift.workspace = true
oxrdf.workspace = true
oxttl.workspace = true
serde_json.workspace = true
