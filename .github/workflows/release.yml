name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Match tag, package version, and changelog
        id: version
        run: |
          VERSION=$(awk '/^\[workspace.package\]/{found=1; next} found && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          test -n "$VERSION"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          grep -F "## $VERSION" CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check publishable root crate
        run: cargo publish --dry-run --locked -p shifty-algebra

  build-cli:
    name: Build CLI (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    needs: validate-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-x86_64
          - runner: windows-latest
            asset: windows-x86_64
          - runner: macos-15
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --locked -p shifty-cli --release
      - name: Verify CLI version (unix)
        if: runner.os != 'Windows'
        env:
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: test "$(target/release/shifty version)" = "$EXPECTED_VERSION"
      - name: Verify CLI version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          $actual = & target/release/shifty.exe version
          if ($actual -ne "$env:EXPECTED_VERSION") {
            throw "expected $env:EXPECTED_VERSION, got $actual"
          }
      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/shifty "dist/shifty-${{ matrix.asset }}"
          tar -czf "dist/shifty-${{ matrix.asset }}.tar.gz" -C dist "shifty-${{ matrix.asset }}"
      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/shifty.exe "dist/shifty-${{ matrix.asset }}.exe"
          Compress-Archive -Path "dist/shifty-${{ matrix.asset }}.exe" -DestinationPath "dist/shifty-${{ matrix.asset }}.zip"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.asset }}
          path: dist

  wheels-linux:
    name: Build wheels (linux)
    runs-on: ubuntu-22.04
    needs: validate-release
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python/Cargo.toml --zig
          manylinux: auto
        env:
          RUSTFLAGS: "-C link-arg=-lc++ -C link-arg=-lc++abi"
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  wheels-musllinux:
    name: Build wheels (musllinux)
    runs-on: ubuntu-22.04
    needs: validate-release
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python/Cargo.toml --zig
          manylinux: musllinux_1_2
        env:
          RUSTFLAGS: "-C link-arg=-lc++ -C link-arg=-lc++abi"
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  wheels-windows:
    name: Build wheels (windows)
    runs-on: windows-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --manifest-path python/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  wheels-macos:
    name: Build wheels (macos)
    runs-on: macos-15
    needs: validate-release
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v5
      - name: Set macOS deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --manifest-path python/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-aarch64
          path: dist

  wheels-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  smoke-wheel:
    name: Smoke-test wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - wheels-linux
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Import and validate
        env:
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: >-
          python -c
          "import os, shifty;
          assert shifty.__version__ == os.environ['EXPECTED_VERSION'];
          graph = '@prefix sh: <http://www.w3.org/ns/shacl#>. @prefix ex: <http://example.org/>. ex:S a sh:NodeShape; sh:targetNode ex:x; sh:nodeKind sh:IRI.';
          assert shifty.validate_algebra(graph, infer=False).conforms"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-cli
      - wheels-linux
      - wheels-musllinux
      - wheels-windows
      - wheels-macos
      - wheels-sdist
      - smoke-wheel
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.whl
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - wheels-linux
      - wheels-musllinux
      - wheels-windows
      - wheels-macos
      - wheels-sdist
      - smoke-wheel
    environment:
      name: publish
      url: https://pypi.org/p/pyshifty
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish_crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs:
      - build-cli
    environment:
      name: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p shifty-algebra
          sleep 30
          cargo publish --locked -p shifty-parse
          cargo publish --locked -p shifty-repair
          sleep 30
          cargo publish --locked -p shifty-opt
          sleep 30
          cargo publish --locked -p shifty-engine
          sleep 30
          cargo publish --locked -p shifty-cli
